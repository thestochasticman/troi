# Shared Borevitz Lab conda environment.
#
# Every lab repo ships an environment.yml targeting this same env name.
# In any repo, run:
#
#   conda env update -n troi -f environment.yml
#
# — creates the troi env if it doesn't exist, and adds that
# repo's packages to it if it does (never removes anything: don't use
# --prune). Then: conda activate troi && pip install -e .
name: troi
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - attrs
  - tabulate
  - typing_extensions
